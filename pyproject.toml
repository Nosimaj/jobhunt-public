[project]
name = "jobhunt"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["pypdf>=4.0", "python-docx>=1.1", "pydantic>=2.6", "PyYAML>=6.0", "httpx>=0.27", "anthropic>=1.8"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
dashboard = ["fastapi>=0.110", "jinja2>=3.1", "uvicorn>=0.27"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
